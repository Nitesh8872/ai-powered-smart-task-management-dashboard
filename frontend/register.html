<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDesk - Join Now</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Global Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div id="toast-container"></div>

    <div class="auth-card" style="width: 500px;">
        <div class="auth-brand">
            <i class="fa-solid fa-cube"></i>
            <span>SmartDesk</span>
        </div>

        <h2>Create Account</h2>
        <p>Start organizing your student life with power.</p>

        <div class="auth-form">
            <div class="input-group" style="margin-bottom: 20px;">
                <label>Full Name</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 18px; top: 18px; color: #94a3b8;"></i>
                    <input type="text" id="name" placeholder="John Doe" style="padding-left: 50px; width: 100%;">
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 20px;">
                <label>Email Address</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope"
                        style="position: absolute; left: 18px; top: 18px; color: #94a3b8;"></i>
                    <input type="email" id="email" placeholder="john@university.edu"
                        style="padding-left: 50px; width: 100%;">
                </div>
                <small id="emailError" class="error-text" style="display: block; color: #ef4444; margin-top: 8px; min-height: 16px;"></small>
            </div>

            <div class="input-group" style="margin-bottom: 15px;">
                <label>Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 18px; top: 18px; color: #94a3b8;"></i>
                    <input type="password" id="password" placeholder="••••••••" style="padding-left: 50px; width: 100%;">
                    <i class="fa-solid fa-eye"
                        style="position: absolute; right: 18px; top: 18px; cursor: pointer; color: #94a3b8;"
                        onclick="togglePassword('password', this)"></i>
                </div>
                <div class="password-strength" id="strengthContainer"
                    style="display: none; height: 4px; gap: 4px; margin-top: 10px;">
                    <div class="strength-bar" id="bar1"
                        style="flex: 1; height: 100%; border-radius: 2px; background: #e2e8f0;"></div>
                    <div class="strength-bar" id="bar2"
                        style="flex: 1; height: 100%; border-radius: 2px; background: #e2e8f0;"></div>
                    <div class="strength-bar" id="bar3"
                        style="flex: 1; height: 100%; border-radius: 2px; background: #e2e8f0;"></div>
                </div>
                <small id="strengthText" style="font-size: 11px; margin-top: 6px; display: block;"></small>
            </div>

            <div class="input-group" style="margin-bottom: 30px;">
                <label>Confirm Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 18px; top: 18px; color: #94a3b8;"></i>
                    <input type="password" id="confirmPassword" placeholder="••••••••"
                        style="padding-left: 50px; width: 100%;">
                </div>
                <small id="confirmError" class="error-text" style="display: block; color: #ef4444; margin-top: 8px; min-height: 16px;"></small>
            </div>

            <button class="btn-primary" id="registerBtn"
                style="width: 100%; padding: 16px; font-size: 15px; font-weight: 800; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);">
                Create Account
            </button>
        </div>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script type="module" src="/src/pages/registerPage.js"></script>
</body>

</html>
