version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/student-dashboard
      - JWT_SECRET=local-docker-jwt-secret-change-me
      - REFRESH_SECRET=local-docker-refresh-secret-change-me
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:5500
      - PORT=5000
      - NODE_ENV=development
    depends_on:
      - mongo
    volumes:
      - ./frontend:/frontend

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
